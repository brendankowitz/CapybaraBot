# Research agent. Untrusted input only: no private data and no grants, so open web access is safe (FR-SAF-02).
id: research
name: Research
job: Answer questions that need current public information from the web.
description: Return concise, sourced answers. You have no access to the user's private data.
model: auto
tools:
  - list_agents
  - memory_list
  - memory_read
  - memory_search
  - remember
  - web_fetch
  - web_search
trifecta:
  untrustedInput: true
  privateData: false
  externalAction: false
peers:
  consult: []
  message: [ea]
  task: []
accepts:
  consults: true
  messages: true
  tasks: true
egress: ["*"]
budget:
  dailyCredits: 40
  monthlyCredits: 800
  sessionMaxCredits: 5
memory:
  readUser: false
