# Operator-owned egress allowlist for capybarad (FR-HST-02, FR-SAF-07).
# Install as /etc/systemd/system/capybarad.service.d/egress.conf, then `systemctl daemon-reload && systemctl restart capybarad`.
#
# capybarad.service ships with IPAddressDeny=any and only loopback + the tailnet allowed. systemd filters by IP address, so
# list the CIDR ranges of the endpoints capybarad must reach. Do not allow 0.0.0.0/0: that disables the filter.
# GitHub publishes its ranges at https://api.github.com/meta (the "web" and "api" sets cover github.com and the Copilot API);
# take the others (Telegram, ntfy server, Google, Microsoft) from their published IP range lists or your own resolver.
[Service]
# IPAddressAllow=192.0.2.0/24
# IPAddressAllow=2001:db8::/32
